apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulse.fullname" . }}-credentials
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  PULSE_DB_PASSWORD: {{ required "Set database.password to the PostgreSQL password." .Values.database.password | quote }}
  PULSE_RABBITMQ_PASSWORD: {{ required "Set rabbitmq.password to the RabbitMQ password." .Values.rabbitmq.password | quote }}
