apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pulse.fullname" . }}-rabbitmq
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  serviceName: {{ include "pulse.fullname" . }}-rabbitmq
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "pulse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        {{- include "pulse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: "{{ .Values.rabbitmq.image.repository }}:{{ .Values.rabbitmq.image.tag }}"
          imagePullPolicy: {{ .Values.rabbitmq.image.pullPolicy }}
          env:
            # Keep the node identity stable when the StatefulSet pod is recreated.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RABBITMQ_NODENAME
              value: "rabbit@$(POD_NAME)"
            - name: RABBITMQ_NODE_PORT
              value: {{ .Values.rabbitmq.port | quote }}
            - name: RABBITMQ_DEFAULT_USER
              value: {{ .Values.rabbitmq.username | quote }}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "pulse.fullname" . }}-credentials
                  key: PULSE_RABBITMQ_PASSWORD
            - name: RABBITMQ_DEFAULT_VHOST
              value: {{ .Values.rabbitmq.virtualHost | quote }}
          ports:
            - name: amqp
              containerPort: {{ .Values.rabbitmq.port }}
            {{- if .Values.monitoring.enabled }}
            - name: metrics
              containerPort: 15692
            {{- end }}
          startupProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 5
            timeoutSeconds: 5
          {{- with .Values.rabbitmq.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if ne .Values.rabbitmq.storage.storageClass nil }}
        storageClassName: {{ .Values.rabbitmq.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.rabbitmq.storage.size | quote }}
