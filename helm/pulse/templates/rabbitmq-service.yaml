apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulse.fullname" . }}-rabbitmq
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  clusterIP: None
  ports:
    - name: amqp
      port: {{ .Values.rabbitmq.port }}
      targetPort: amqp
  selector:
    {{- include "pulse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
