apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulse.fullname" . }}-config
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
data:
  PULSE_STORAGE_BACKEND: {{ .Values.storage.backend | quote }}
  {{- if eq .Values.storage.backend "s3" }}
  PULSE_S3_BUCKET: {{ required "Set storage.s3.bucket when storage.backend is s3" .Values.storage.s3.bucket | quote }}
  PULSE_S3_REGION: {{ required "Set storage.s3.region when storage.backend is s3" .Values.storage.s3.region | quote }}
  {{- end }}
  PULSE_DB_HOST: {{ printf "%s-postgres" (include "pulse.fullname" .) | quote }}
  PULSE_DB_PORT: {{ .Values.database.port | quote }}
  PULSE_DB_NAME: {{ .Values.database.name | quote }}
  PULSE_DB_USER: {{ .Values.database.user | quote }}
  PULSE_RABBITMQ_HOST: {{ printf "%s-rabbitmq" (include "pulse.fullname" .) | quote }}
  PULSE_RABBITMQ_PORT: {{ .Values.rabbitmq.port | quote }}
  PULSE_RABBITMQ_USERNAME: {{ .Values.rabbitmq.username | quote }}
  PULSE_RABBITMQ_VIRTUAL_HOST: {{ .Values.rabbitmq.virtualHost | quote }}
  PULSE_RABBITMQ_QUEUE_NAME: {{ .Values.rabbitmq.queueName | quote }}
  PULSE_STORAGE_ROOT: {{ .Values.storage.root | quote }}
  PULSE_MAX_UPLOAD_BYTES: {{ .Values.uploads.maxBytes | int64 | quote }}
