[project]
name = "pulse-api"
version = "0.3.0"
description = "Pulse document-processing API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.143.0,<0.144.0",
    "uvicorn>=0.54.0,<0.55.0",
    "click>=8.5.0,<9.0.0",
    "sqlalchemy (>=2.1.4,<2.2)",
    "alembic (>=1.20.0,<2)",
    "psycopg[binary] (>=3.3.6,<4)",
    "pydantic-settings (>=2.16.0,<3)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pika (>=1.4.4,<2.0.0)",
    "prometheus-client (>=0.26.0,<0.27.0)",
    "boto3[crt] (>=1.42,<2)",
]

[project.scripts]
pulse-api = "api.cli.main:cli"
pulse-worker = "api.cli.main:worker_cli"

[tool.poetry]
packages = [{ include = "api" }]

[tool.poetry.group.dev.dependencies]
httpx = ">=0.28.1,<0.29.0"
pytest = ">=9.1.1,<10.0.0"
ruff = ">=0.17.0,<0.18.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires PostgreSQL and a local, development, or test environment"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
