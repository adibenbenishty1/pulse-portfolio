[project]
name = "pulse-client"
version = "0.1.2"
description = "Python SDK and CLI for the Pulse API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1,<0.29.0",
    "click>=8.5.0,<9.0.0",
    "pydantic (>=2.14.1,<3)",
]

[project.scripts]
pulse-client = "client.cli:cli"

[tool.poetry]
packages = [{ include = "client" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0.0"
ruff = ">=0.17.0,<0.18.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
