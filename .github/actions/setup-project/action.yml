name: Set up project
description: Check out, install Poetry dependencies, and optionally lint the project

inputs:
  working-directory:
    description: Project directory
    required: true
  run-lint:
    description: Lint the project with Ruff
    default: 'true'

runs:
  using: composite

  steps:
    - name: Check out repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install Poetry
      shell: bash
      run: pipx install poetry==2.3.2

    - name: Restore dependencies
      uses: actions/cache@v4
      with:
        path: ${{ inputs.working-directory }}/.venv
        key: >-
          ${{ format(
            'poetry-{0}-{1}-py313-2.3.2-{2}-{3}',
            runner.os,
            runner.arch,
            inputs.working-directory,
            hashFiles(
              format('{0}/poetry.lock', inputs.working-directory),
              format('{0}/pyproject.toml', inputs.working-directory)
            )
          ) }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: poetry install --no-interaction

    - name: Lint project
      if: inputs.run-lint == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: poetry run ruff check .
